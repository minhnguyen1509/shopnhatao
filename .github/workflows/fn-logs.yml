name: Xem log máy chủ

on:
  workflow_dispatch: {}

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Log gửi email 6 giờ gần nhất
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="sendinvoiceemail" AND severity>=DEFAULT' --project shopnhatao-b8f59 --freshness=6h --limit=60 --format='value(timestamp,severity,textPayload,jsonPayload.message,httpRequest.status)' | grep -v "^\s*$" | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}/<email>/g' | head -80
