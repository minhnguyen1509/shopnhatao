name: Đưa web lên Firebase

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cài thư viện cho Cloud Functions
        run: npm install --prefix functions --omit=dev --no-audit --no-fund

      - name: Ghi khóa dịch vụ (lấy từ GitHub Secrets)
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "Chưa có secret FIREBASE_SERVICE_ACCOUNT"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - name: Deploy (web, quy tắc bảo mật, functions)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@15 deploy --project shopnhatao-b8f59 --non-interactive --force

      - name: Xóa khóa tạm
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
