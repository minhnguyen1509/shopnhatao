name: Bật sao lưu Firestore hằng ngày

on:
  workflow_dispatch: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Tạo lịch sao lưu (nếu chưa có) và liệt kê
        run: |
          P=shopnhatao-b8f59
          if ! gcloud firestore backups schedules list --database='(default)' --project $P --format='value(name)' | grep -q .; then
            gcloud firestore backups schedules create --database='(default)' --recurrence=daily --retention=14d --project $P
          fi
          echo "== Lịch sao lưu"; gcloud firestore backups schedules list --database='(default)' --project $P
