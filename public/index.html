<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop Nhà Táo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="description" content="Shop Nhà Táo – iPhone, iPad, MacBook, AirPods, Apple Watch mới & cũ, phụ kiện chính hãng, thay pin, thay màn hình.">
<meta property="og:title" content="Shop Nhà Táo">
<meta property="og:description" content="Táo xịn, giá hiền, bảo hành tận tâm. Uy tín từ 2020.">
<link rel="icon" href="/logo-mark.webp">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
<script src="/firebase-config.js"></script>
<style>
:root{--bg:#FBF8F3;--bg2:#F4EEE5;--ink:#1E1B18;--muted:#6F675F;--line:#E7DFD3;--card:#fff;--red:#C8372D;--red2:#A82A21;--green:#2E7D4F;--amber:#B7791F;--blue:#2F5D8C;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.row{display:flex;align-items:center;gap:12px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#cfc5b6}
.btn-red{background:var(--red);border-color:var(--red);color:#fff}.btn-red:hover{background:var(--red2);border-color:var(--red2)}
.btn-ink{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-green{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}
label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--bg2);white-space:nowrap}
.pill.red{background:#FBE3E0;color:var(--red2)}.pill.green{background:#DDF0E4;color:#1F6A3E}.pill.amber{background:#FBEFD6;color:#8A5A12}.pill.blue{background:#DFE9F5;color:#244A72}.pill.gray{background:#ECE8E2;color:#5E574F}

/* mode bar */
#modebar{position:sticky;top:0;z-index:50;background:var(--ink);color:#EDE6DA;font-size:13px}
#modebar .wrap{display:flex;align-items:center;gap:10px;padding-top:7px;padding-bottom:7px;max-width:none}
#modebar .seg{display:flex;background:#ffffff14;border-radius:9px;padding:3px}
#modebar .seg button{border:0;background:transparent;color:#EDE6DA;padding:5px 12px;border-radius:7px;cursor:pointer;font-weight:600}
#modebar .seg button.on{background:#FBF8F3;color:var(--ink)}
#modebar .tag{opacity:.75}
#modebar .sp{flex:1}

/* ===== SHOP ===== */
.sh-head{background:rgba(251,248,243,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:41px;z-index:40}
body.pub .sh-head{top:0}body.pub #modebar{display:none}body.pub .adm{min-height:100vh}body.pub .adm aside{top:0;height:100vh}
.login{max-width:440px;margin:60px auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px 28px}.login h1{font-size:22px;margin:14px 0 6px}
.sh-head .wrap{display:flex;align-items:center;gap:20px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand b{display:block;font-size:18px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:-3px}
.sh-nav{display:flex;gap:4px;flex:1;justify-content:center}
.sh-nav button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--muted)}
.sh-nav button:hover{background:var(--bg2);color:var(--ink)}
.hero{padding:56px 0 40px}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:46px;line-height:1.08;letter-spacing:-.025em;margin:0 0 14px;font-weight:800}
.hero h1 em{font-style:normal;color:var(--red)}
.hero p.lead{font-size:17px;color:var(--muted);margin:0 0 24px;max-width:520px}
.trust{display:flex;gap:22px;margin-top:28px;flex-wrap:wrap}
.trust div{font-size:13px;color:var(--muted)}.trust b{display:block;color:var(--ink);font-size:15px}
.hero-art{position:relative;height:330px}
.hero-art .ph{position:absolute;width:150px;filter:drop-shadow(0 18px 24px rgba(30,27,24,.16))}
.hero-art .bg{position:absolute;inset:30px 10px 0 30px;background:var(--bg2);border-radius:32px}
section.blk{padding:40px 0}
.blk h2{font-size:28px;letter-spacing:-.02em;margin:0 0 4px}
.blk .sub{color:var(--muted);margin:0 0 20px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:14px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.toolbar input{max-width:260px}.toolbar select{max-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(30,27,24,.08)}
.card-img{background:var(--bg2);height:170px;display:flex;align-items:center;justify-content:center;position:relative}
.card-img svg{height:140px}
.card-img img.pimg{max-height:150px;max-width:88%;object-fit:contain}
.det-img img.pimg{max-height:160px;max-width:92%;object-fit:contain}
.gal-main{background:var(--bg2);border-radius:14px;height:340px;display:flex;align-items:center;justify-content:center;overflow:hidden}.gal-main img{max-width:100%;max-height:100%;object-fit:contain}.gal-main svg{height:240px}
.gal-th{display:flex;gap:8px;overflow-x:auto;padding:10px 0}.gal-th button{border:2px solid transparent;border-radius:10px;padding:0;background:var(--bg2);cursor:pointer;flex:none}.gal-th button.on{border-color:var(--ink)}.gal-th img{width:64px;height:64px;object-fit:cover;border-radius:8px;display:block}
.uthumb{border:0;padding:0;background:none;cursor:pointer;position:relative}.uthumb img{width:48px;height:48px;object-fit:cover;border-radius:9px;border:1px solid var(--line);display:block}.uthumb span{position:absolute;right:-4px;bottom:-4px;background:var(--ink);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:0 5px}
.ph-edit{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}.ph-edit div{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.ph-edit img{width:100%;height:120px;object-fit:cover;display:block}.ph-edit .acts{padding:6px}
.thumb{width:22px;height:22px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ph-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ph-card .im{height:150px;background:var(--bg2);display:flex;align-items:center;justify-content:center}
.ph-card .im svg{height:120px}.ph-card .im img{max-height:140px;max-width:90%;object-fit:contain}
.ph-card .bd{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.card-img .emo{font-size:64px}
.card-img .badge{position:absolute;top:10px;left:10px}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-body h3{margin:0;font-size:16px;letter-spacing:-.01em}
.chips-sm{display:flex;gap:4px;flex-wrap:wrap}.chips-sm span{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.dots{display:flex;gap:5px}.dots i{width:14px;height:14px;border-radius:50%;border:1px solid #0002;display:inline-block}
.price{font-weight:800;font-size:18px;color:var(--red);margin-top:auto}.price small{font-weight:500;font-size:12px;color:var(--muted)}
.stock{font-size:12px;color:var(--green);font-weight:600}
.empty{padding:40px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
.svc-wrap{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel h3{margin:0 0 6px}
.bh-res{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.bh-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.contact{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.contact .panel b{display:block;font-size:13px;color:var(--muted);font-weight:500}
.contact .panel span{font-weight:700}
footer.sh-foot{border-top:1px solid var(--line);padding:24px 0 90px;color:var(--muted);font-size:13px;margin-top:20px}
.float{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:45}
.float a{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.det{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;margin-bottom:12px}
.det-img{background:var(--bg2);border-radius:12px;height:170px;display:flex;align-items:center;justify-content:center}.det-img svg{height:140px}
.det h2{margin:0 0 4px;font-size:24px}
.units{display:flex;flex-direction:column;gap:8px}
.unit{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.unit .dot{width:18px;height:18px;border-radius:50%;border:1px solid #0002}
.unit small{display:block;color:var(--muted);font-size:12px}
.u-price{font-weight:800;color:var(--red)}
.u-act{display:flex;gap:6px}
.box{background:var(--bg2);border-radius:10px;padding:12px 14px;font-size:14px}
.box b{font-weight:700}

/* ===== ADMIN ===== */
.adm{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 41px)}
.adm aside{background:#24201C;color:#E9E1D4;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:41px;height:calc(100vh - 41px);overflow:auto}
.adm aside .brand{padding:4px 8px 16px}.adm aside .brand small{color:#A99F92}
.adm aside .tab{display:flex;align-items:center;justify-content:space-between;border:0;background:transparent;color:#D8CFC1;padding:9px 12px;border-radius:9px;cursor:pointer;font-weight:500;text-align:left}
.adm aside .tab:hover{background:#ffffff10}
.adm aside .tab.on{background:#FBF8F3;color:var(--ink);font-weight:700}
.adm aside .tab .n{background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
.adm aside .who{margin-top:auto;padding:12px 8px 0;border-top:1px solid #ffffff1a;font-size:12px;color:#A99F92}
.adm aside .who select{background:#ffffff12;border-color:#ffffff22;color:#fff;margin-top:6px}
.adm aside .who select option{color:#000}
.adm main{padding:24px 28px 60px;min-width:0}
.adm h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
.adm .hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi small{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em;margin-top:2px}
.kpi span{font-size:12px;color:var(--muted)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border-bottom:1px solid var(--line);background:#FDFBF8;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #F1EBE2;vertical-align:top}
tr:last-child td{border-bottom:0}
td .s{display:block;font-size:12px;color:var(--muted)}
td.num,th.num{text-align:right;white-space:nowrap}
.acts{display:flex;gap:4px;flex-wrap:wrap}
.list-h{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px}.list-h h3{margin:0;font-size:16px}
.pos{display:grid;grid-template-columns:1fr 400px;gap:16px;align-items:start}
.res-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #F1EBE2}
.cart-line{display:grid;grid-template-columns:1fr 110px 28px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #F1EBE2}
.cart-line input{padding:6px 8px;text-align:right}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:12px 0}
.bars{display:flex;align-items:flex-end;gap:18px;height:220px;padding:10px 4px 0;border-bottom:1px solid var(--line)}
.bars .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .pair{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bars .b{width:40%;max-width:34px;border-radius:5px 5px 0 0;min-height:2px}
.bars .lbl{font-size:12px;color:var(--muted);padding-top:6px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:10px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.banner{background:#FBEFD6;color:#7A4E0E;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:14px}
.banner.red{background:#FBE3E0;color:var(--red2)}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(30,27,24,.45);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;overflow:auto}
.modal-card{background:var(--bg);border-radius:18px;max-width:640px;width:100%;padding:24px;position:relative;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.modal-card .x{position:absolute;top:12px;right:12px;border:0;background:var(--bg2);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px}
.modal-card h2{margin:0 0 6px;font-size:22px}
.modal-card .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
pre.rcpt{background:#fff;border:1px dashed var(--line);border-radius:10px;padding:14px;font-size:13px;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace}

@media (max-width:900px){
  .hero .wrap,.svc-wrap,.pos,.cols2{grid-template-columns:1fr}
  .hero-art{display:none}.hero h1{font-size:34px}
  .sh-nav{display:none}.sh-head .wrap>.btn{margin-left:auto}
  .contact{grid-template-columns:1fr 1fr}
  .adm{grid-template-columns:1fr}
  .adm aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px}
  .adm aside .brand,.adm aside .who{display:none}
  .adm aside .tab{white-space:nowrap}
  .adm main{padding:18px 14px 60px}
  .unit{grid-template-columns:auto 1fr;}.u-price,.u-act{grid-column:2}
  .fgrid{grid-template-columns:1fr}
}
/* preview (tên miền riêng) */
.pv-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;background:var(--bg2);border-bottom:1px solid var(--line)}
.pv-stage{padding:18px;display:flex;justify-content:center;background:#E9E3D9;min-height:calc(100vh - 100px)}
.pv-win{position:relative;background:var(--bg);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.18);overflow:hidden;display:flex;flex-direction:column;width:100%;max-width:1280px;height:calc(100vh - 140px)}
.pv-win.mob{max-width:390px;height:min(820px,calc(100vh - 140px));border-radius:36px;border:10px solid #1E1B18}
.pv-chrome{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#F1ECE4;border-bottom:1px solid var(--line);flex:none}
.pv-chrome .dots i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px}
.pv-url{flex:1;background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-url b{color:var(--ink);font-weight:600}
.pv-win.mob .pv-chrome .dots{display:none}
.pv-scroll{flex:1;overflow:auto;container-type:inline-size;position:relative}
.pv-scroll .sh-head{top:0}
.pv-win .float{position:absolute;right:14px;bottom:14px}
.pv-win.mob .float a{width:46px;height:46px;font-size:12px}
@container (max-width:900px){
  .hero .wrap,.svc-wrap{grid-template-columns:1fr}
  .hero-art{display:none}.hero h1{font-size:32px}.hero{padding:32px 0 24px}
  .sh-nav{display:none}
  .contact{grid-template-columns:1fr 1fr}
  .unit{grid-template-columns:auto 1fr}.u-price,.u-act{grid-column:2}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .card-img{height:140px}.card-img svg,.card-img img.pimg{max-height:120px;height:auto}
  .toolbar input,.toolbar select{max-width:none}
  .wrap{padding:0 14px}
  .blk h2{font-size:23px}
  .sh-head .wrap>.btn{margin-left:auto;padding:8px 12px}
  .trust{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:20px}
  .hero .row .btn{flex:1}
}
#print-area{display:none}
@media print{
  @page{size:A4;margin:14mm 14mm 12mm}
  html,body{background:#fff!important;margin:0!important}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important;font-family:"Times New Roman",Times,serif;color:#000;font-size:13pt;line-height:1.35}
  .inv-page{page-break-after:always;break-after:page}
  .inv-page:last-child{page-break-after:auto;break-after:auto}
  .inv-head{display:flex;align-items:center;gap:18px}
  .inv-head img{width:28mm;height:28mm;object-fit:cover}
  .inv-shop{flex:1;text-align:left;font-size:12.5pt}
  .inv-shop .n{font-weight:700;font-size:15pt}
  .inv-shop .sub{font-weight:700;font-size:13pt}
  .inv-page h1{text-align:center;font-size:20pt;margin:9mm 0 1mm;letter-spacing:.5px}
  .inv-code{text-align:center;font-size:11pt;margin-bottom:6mm}
  .inv-cus div{margin:1mm 0}
  .inv-t{width:100%;border-collapse:collapse;margin-top:5mm;font-size:12pt}
  .inv-t{table-layout:fixed;box-sizing:border-box;width:99%!important;margin-right:auto}
  .inv-t th,.inv-t td{border:1px solid #000!important;padding:1.6mm 1.8mm;vertical-align:middle;background:none!important;color:#000!important}
  .inv-t th{font-weight:700;text-align:center;text-transform:none!important;letter-spacing:0!important;font-size:12pt!important;white-space:normal}
  .inv-t tr.blank td{height:6mm;padding:0}
  .inv-t .c{text-align:center}.inv-t .r{text-align:right}.inv-t .b{font-weight:700}.inv-t .sm{font-size:10.5pt}

const guessNet=o=>{const s=String(o||'').toUpperCase();if(!s)return '';if(s.includes('LOCK'))return 'lock';if(s.includes('VN/A'))return 'vn';if(s.includes('LL/A'))return 'qtmy';if(/[A-Z]{1,2}\/A/.test(s)||s.includes('EU'))return 'qt';return ''};
const netOf=u=>NET[u.net]?u.net:guessNet(u.origin);
const netPill=u=>{const n=netOf(u);return n?pill(NET[n],NET_CLS[n]):''};
const isoDay=t=>{const d=new Date(t||Date.now());return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const shortCode=u=>'M'+String(u.imei||u.id).slice(-5).toUpperCase();
const pill=(t,c)=>`<span class="pill ${c||''}">${esc(t)}</span>`;

/* ================= derived ================= */
function phoneGroups(){
  const m={};
  S.inv.filter(x=>x.status==='instock').forEach(x=>{const cond=x.condition==='new'?'new':'used';const k=x.model+'|'+cond;(m[k]=m[k]||{key:k,model:x.model,cond,cat:catOf(x),units:[]}).units.push(x)});
  return Object.values(m).map(g=>({...g,min:Math.min(...g.units.map(u=>+u.price||0)),colors:[...new Set(g.units.map(u=>u.color))],storages:[...new Set(g.units.map(u=>u.storage).filter(Boolean))].sort((a,b)=>STORAGES.indexOf(a)-STORAGES.indexOf(b))}));
}
function warrantyEnd(o,it){if(!it.warrantyMonths)return null;const d=new Date(o.doneAt||o.createdAt);d.setMonth(d.getMonth()+(+it.warrantyMonths));return d.getTime()}
function customers(){
  const m={};const add=(phone,name,t)=>{if(!phone)return null;const c=m[phone]=m[phone]||{phone,name:'',orders:0,spent:0,repairs:0,last:0};if(name&&name!=='Khách lẻ')c.name=name;c.last=Math.max(c.last,t||0);return c};
  S.orders.filter(o=>o.status==='done').forEach(o=>{const c=add(o.phone,o.customerName,o.doneAt||o.createdAt);if(c){c.orders++;c.spent+=+o.total||0}});
  S.repairs.filter(r=>r.status!=='cancelled').forEach(r=>{const c=add(r.phone,r.customerName,r.createdAt);if(c){c.repairs++;if(r.status==='returned')c.spent+=+r.quote||0}});
  return Object.values(m).sort((a,b)=>b.last-a.last);
}
const mKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
function finance(){
  const by={};const g=k=>by[k]=by[k]||{rev:0,cost:0,phone:0,acc:0,rep:0,repCost:0};
  S.orders.filter(o=>o.status==='done').forEach(o=>{const b=g(mKey(o.doneAt||o.createdAt));(o.items||[]).forEach(it=>{const cm=S.costMap||{};const uc=+it.cost||(it.kind==='phone'?+((cm['inv-'+it.refId]||{}).costPrice||0):+((cm['acc-'+it.refId]||{}).cost||0));const r=(+it.price||0)*(+it.qty||1),c=uc*(+it.qty||1);b.rev+=r;b.cost+=c;if(it.kind==='phone')b.phone+=r;else b.acc+=r})});
  S.repairs.filter(r=>r.status==='returned').forEach(r=>{const b=g(mKey(r.returnedAt||r.createdAt));b.rev+=+r.quote||0;b.cost+=+r.cost||0;b.rep+=+r.quote||0;b.repCost+=+r.cost||0});
  return by;
}

function bhResult(){
  const q=S.bhQ.trim();if(!q)return '';if(!S.auth.staff)return bhPublic();const qp=normPhone(q);const tail=q.replace(/\s/g,'');

  S.repairs.filter(r=>(byPhone&&r.phone===qp)||(byImei&&endT(r.imei))).forEach(r=>{const s=REP_ST[r.status]||['',''];out.push(`<div class="bh-item"><div><b>Sửa chữa: ${esc(r.device)}</b><small class="muted" style="display:block">${esc(r.issue||'')} · Nhận ${fmtD(r.createdAt)}</small></div>${pill(s[0],s[1])}</div>`)});

}

function aDash(){
  const today=new Date();today.setHours(0,0,0,0);const t0=today.getTime();const mk=mKey(now());
  const doneToday=S.orders.filter(o=>o.status==='done'&&(o.doneAt||0)>=t0);
  const revToday=doneToday.reduce((s,o)=>s+(+o.total||0),0)+S.repairs.filter(r=>r.status==='returned'&&(r.returnedAt||0)>=t0).reduce((s,r)=>s+(+r.quote||0),0);
  const f=finance()[mk]||{rev:0,cost:0};
  const inst=S.inv.filter(x=>x.status==='instock');
  const old=inst.filter(x=>daysAgo(x.createdAt)>30).sort((a,b)=>a.createdAt-b.createdAt);
  const pend=S.orders.filter(o=>o.status==='pending'||o.status==='confirmed').sort((a,b)=>b.createdAt-a.createdAt);

  const lowAcc=S.acc.filter(a=>(+a.qty||0)<=3);

function ordTable(list,compact){
  if(!list.length)return `<div class="empty">Không có đơn nào.</div>`;
  return `<div class="tbl-wrap"><table><thead><tr><th>Đơn</th><th>Khách</th>${compact?'':'<th>Sản phẩm</th>'}<th class="num">Tổng / cọc</th><th>Trạng thái</th><th></th></tr></thead><tbody>${list.map(o=>{const s=ORD_ST[o.status]||['',''];
    return `<tr><td><b>${esc(o.code)}</b><span class="s">${fmtDT(o.createdAt)} · ${o.source==='web'?'Web':'Tại quầy'}</span></td><td>${esc(o.customerName)}<span class="s">${esc(o.phone)}</span></td>${compact?'':`<td>${(o.items||[]).map(i=>`${esc(i.name)}${i.qty>1?' ×'+i.qty:''}${i.imei?`<span class="s">IMEI …${esc(String(i.imei).slice(-5))}</span>`:''}`).join('<br>')}${o.note?`<span class="s">Ghi chú: ${esc(o.note)}</span>`:''}</td>`}<td class="num"><b>${money(o.total)}</b>${o.deposit?`<span class="s">Cọc ${money(o.deposit)}</span>`:''}</td><td>${pill(s[0],s[1])}${o.staff?`<span class="s">${esc(o.staff)}</span>`:''}</td><td><div class="acts">${W_OK()?ordActs(o):''}</div></td></tr>`}).join('')}</tbody></table></div>`;
}
function ordActs(o){
  const b=[];
  if(o.status==='pending')b.push(`<button class="btn sm btn-ink" data-act="ordSet" data-id="${esc(o.id)}" data-v="confirmed">Đã gọi xác nhận</button>`);
  if(o.status==='pending'||o.status==='confirmed')b.push(`<button class="btn sm btn-green" data-act="ordSet" data-id="${esc(o.id)}" data-v="done">Giao xong</button>`,`<button class="btn sm ghost" data-act="ordSet" data-id="${esc(o.id)}" data-v="cancelled">Hủy</button>`);
  if(o.status==='done')b.push(`<button class="btn sm ghost" data-act="receipt" data-id="${esc(o.id)}">Hóa đơn</button>`);
  return b.join('');
}
function aOrders(){

  if(f==='open')list=list.filter(o=>o.status==='pending'||o.status==='confirmed');else if(f!=='all')list=list.filter(o=>o.status===f);

  `<div class="toolbar"><div class="chips">${[['open','Cần xử lý'],['done','Hoàn tất'],['cancelled','Đã hủy'],['all','Tất cả']].map(([k,l])=>`<button class="chip ${f===k?'on':''}" data-act="set" data-k="ordSt" data-v="${k}">${l}</button>`).join('')}</div></div>${ordTable(list.slice(0,200),false)}`;
}

function aInv(){
  const f=S.invSt,q=S.invQ.toLowerCase().trim();
  const F=S.invF;let list=S.inv.slice();if(f!=='all')list=list.filter(x=>x.status===f);if(S.invCat!=='all')list=list.filter(x=>catOf(x)===S.invCat);
  const base=list.slice();
  if(F.model)list=list.filter(x=>x.model===F.model);if(F.cond)list=list.filter(x=>x.condition===F.cond);if(F.net)list=list.filter(x=>(netOf(x)||'none')===F.net);
  if(F.storage)list=list.filter(x=>(x.storage||'')===F.storage);if(F.color)list=list.filter(x=>(x.color||'')===F.color);
  if(F.age){const a=x=>daysAgo(x.createdAt);list=list.filter(x=>F.age==='7'?a(x)<=7:F.age==='30'?a(x)>7&&a(x)<=30:a(x)>30)}
  if(F.batt){list=list.filter(x=>x.condition!=='new'&&x.battery&&(F.batt==='90'?x.battery>=90:F.batt==='85'?x.battery>=85&&x.battery<90:x.battery<85))}
  const opts=(k,vals,lbl)=>`<select id="if-${k}" data-chg="invF" data-k="${k}" style="max-width:170px"><option value="">${lbl}</option>${vals.map(([v,l])=>`<option value="${esc(v)}" ${F[k]===v?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  const uniq=fn=>[...new Set(base.map(fn).filter(Boolean))].sort((a,b)=>String(a).localeCompare(b,'vi',{numeric:true}));
  const fActive=Object.values(F).some(Boolean);
  if(q)list=list.filter(x=>(`${x.model} ${x.storage} ${x.color} ${x.imei} ${x.note} ${x.origin||''} ${NET[netOf(x)]||''} ${x.source||''}`).toLowerCase().includes(q));
  const cfgKey=x=>[x.model,x.storage||'',x.color||'',x.condition,x.origin||'',netOf(x),x.price,x.status].join('|');
  const cnt={};list.forEach(x=>{const k=cfgKey(x);cnt[k]=(cnt[k]||0)+1});
  const SV={name:x=>String(x.model)+' '+(x.storage||''),cond:x=>({new:0,likenew:1,used:2}[x.condition]??3)*1000-(+x.battery||0),imei:x=>String(x.imei||''),cost:x=>+x.costPrice||0,price:x=>+x.price||0,qty:x=>cnt[cfgKey(x)]||1,date:x=>+x.createdAt||0,status:x=>({instock:0,reserved:1,sold:2}[x.status]??3)};
  const sk=SV[S.invSK]?S.invSK:'date',dir=S.invSD==='asc'?1:-1;
  const cmp=(a,b)=>{const va=SV[sk](a),vb=SV[sk](b);return (typeof va==='string'?va.localeCompare(vb,'vi',{numeric:true}):va-vb)*dir};
  list.sort(cmp);
  let rows=list;if(S.invGroup){const seen={};rows=[];list.forEach(x=>{const k=cfgKey(x);if(!seen[k]){seen[k]={...x,_n:0,_imeis:[]};rows.push(seen[k])}seen[k]._n++;if(x.imei)seen[k]._imeis.push(x.imei)})}
  const th=(k,l,cls='')=>`<th class="${cls}"><button data-act="invSortBy" data-k="${k}" style="border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;white-space:nowrap">${l} <span style="opacity:${sk===k?1:.35}">${sk===k?(dir>0?'▲':'▼'):'↕'}</span></button></th>`;
  const inst=S.inv.filter(x=>x.status==='instock');
  return hd('Kho máy','iPhone, iPad, MacBook, AirPods, Apple Watch: quản lý từng chiếc theo IMEI hoặc Serial. Hàng “Trong kho” tự hiện lên website.',W_OK()?`<button class="btn btn-red" data-act="invForm">+ Nhập máy</button>`:'')+
  (isOwner()?`<div class="kpis"><div class="kpi"><small>Máy trong kho</small><b>${inst.length}</b></div><div class="kpi"><small>Vốn đang nằm kho</small><b>${money(inst.reduce((s,x)=>s+(+x.costPrice||0),0))}</b></div><div class="kpi"><small>Giá trị theo giá bán</small><b>${money(inst.reduce((s,x)=>s+(+x.price||0),0))}</b></div></div>`:'')+
  `<div class="toolbar"><div class="chips">${[['instock','Trong kho'],['reserved','Đang giữ cọc'],['sold','Đã bán'],['all','Tất cả']].map(([k,l])=>`<button class="chip ${f===k?'on':''}" data-act="set" data-k="invSt" data-v="${k}">${l} <span class="muted">${k==='all'?S.inv.length:S.inv.filter(x=>x.status===k).length}</span></button>`).join('')}</div><select id="inv-cat" data-chg="invCat" style="max-width:170px"><option value="all">Mọi loại</option>${CATS.map(c=>`<option ${S.invCat===c?'selected':''}>${c}</option>`).join('')}</select><input id="q-inv" data-live="invQ" placeholder="Tìm tên, IMEI, màu…" value="${esc(S.invQ)}"></div>
  <div class="toolbar" style="margin-top:-8px"><div class="chips"><button class="chip ${S.invGroup?'':'on'}" style="padding:5px 12px;font-size:13px" data-act="set" data-k="invGroup" data-v="">Từng máy</button><button class="chip ${S.invGroup?'on':''}" style="padding:5px 12px;font-size:13px" data-act="set" data-k="invGroup" data-v="1">Gộp máy giống nhau</button></div>${fActive?`<span class="pill blue">Đang xem: ${esc([F.model,F.storage,F.color].filter(Boolean).join(' · '))}</span><button class="btn sm ghost" data-act="invClear">× Bỏ lọc</button>`:''}<span class="muted" style="font-size:13px">${list.length} máy${S.invGroup?' · '+rows.length+' nhóm':''}</span></div>`+
  (rows.length?`<div class="tbl-wrap"><table><thead><tr>${th('name','Sản phẩm')}${th('cond','Tình trạng')}${th('imei','IMEI / Serial')}${isOwner()?th('cost','Giá nhập','num'):''}${th('price','Giá bán','num')}${th('qty','Số lượng','num')}${th('date','Nhập')}${th('status','Trạng thái')}<th></th></tr></thead><tbody>${rows.slice(0,300).map(x=>{const n=S.invGroup?x._n:(cnt[cfgKey(x)]||1);const s=INV_ST[x.status]||['',''];return `<tr><td><b>${esc(x.model)} ${esc(x.storage||'')}</b><span class="s">${catOf(x)} · ${esc(x.color)}${x.origin?' · '+esc(x.origin):''}${netOf(x)?' · '+NET[netOf(x)]:''}${x.note?' · '+esc(x.note):''}${x.source?`<br>Nguồn: ${esc(x.source)}`:''}</span></td><td>${COND[x.condition]||''}${x.condition!=='new'&&x.battery?`<span class="s">Pin ${x.battery}%</span>`:''}</td><td style="font-family:ui-monospace,monospace;font-size:13px">${S.invGroup?(x._imeis.length?x._imeis.slice(0,3).map(esc).join('<br>')+(x._imeis.length>3?`<span class="s">+${x._imeis.length-3} IMEI khác</span>`:''):'—'):esc(x.imei||'—')}</td>${isOwner()?`<td class="num">${money(x.costPrice)}</td>`:''}<td class="num"><b>${money(x.price)}</b>${isOwner()&&x.costPrice?`<span class="s">lãi ${money(x.price-x.costPrice)}</span>`:''}</td><td class="num">${n>1?`<button class="btn sm ghost" data-act="invSame" data-id="${esc(x.id)}" title="${S.invGroup?'Xem từng máy trong nhóm':'Lọc các máy giống hệt'}"><b>${n}</b></button>`:'<b>1</b>'}</td><td>${S.invGroup&&n>1?'Nhiều ngày':fmtD(x.createdAt)}<span class="s">${x.status==='instock'?daysAgo(x.createdAt)+' ngày':''}</span></td><td>${pill(s[0],s[1])}${x.orderCode?`<span class="s">${esc(x.orderCode)}</span>`:''}</td><td>${S.invGroup&&n>1?`<div class="acts"><button class="btn sm" data-act="invSame" data-id="${esc(x.id)}">Xem ${n} máy</button>${W_OK()?`<button class="btn sm ghost" data-act="invDup" data-id="${esc(x.id)}">Nhân bản</button>`:''}</div>`:W_OK()?`<div class="acts"><button class="btn sm" data-act="invForm" data-id="${esc(x.id)}">Sửa</button><button class="btn sm ghost" data-act="invDup" data-id="${esc(x.id)}" title="Tạo máy mới với thông tin giống hệt máy này">Nhân bản</button>${ASSETS&&x.condition!=='new'?`<button class="btn sm ghost" data-act="unitPhotos" data-id="${esc(x.id)}" title="Ảnh chụp thật các góc của máy này">Ảnh máy${unitImgs(x).length?' ('+unitImgs(x).length+')':''}</button>`:''}${isOwner()?`<button class="btn sm ghost" data-act="del" data-col="inventory" data-id="${esc(x.id)}" data-name="${esc(x.model+' '+x.storage+' '+(x.imei||''))}">Xóa</button>`:''}</div>`:''}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty">Không có máy nào.</div>`);
}

function repTable(list,compact){
  if(!list.length)return `<div class="empty">Không có phiếu nào.</div>`;
  return `<div class="tbl-wrap"><table><thead><tr><th>Phiếu</th><th>Khách / máy</th>${compact?'':'<th>Lỗi</th><th>Nơi sửa</th>'}<th class="num">Báo giá</th><th>Trạng thái</th><th></th></tr></thead><tbody>${list.map(r=>{const s=REP_ST[r.status]||['',''];return `<tr><td><b>${esc(r.code)}</b><span class="s">${fmtDT(r.createdAt)}${r.source==='web'?' · Web':''}</span></td><td>${esc(r.customerName)}<span class="s">${esc(r.phone)} · ${esc(r.device)}</span></td>${compact?'':`<td>${esc(r.issue)}${r.wish?`<span class="s">Hẹn: ${esc(r.wish)}</span>`:''}</td><td>${r.kind==='outsource'?`Gửi ngoài<span class="s">${esc(r.partner||'')}</span>`:'Tại shop'}</td>`}<td class="num">${r.quote?money(r.quote):'—'}${isOwner()&&r.cost?`<span class="s">chi phí ${money(r.cost)}</span>`:''}</td><td>${pill(s[0],s[1])}</td><td><div class="acts">${W_OK()?repActs(r):''}</div></td></tr>`}).join('')}</tbody></table></div>`;
}
function repActs(r){
  const b=(v,l,c='btn-ink')=>`<button class="btn sm ${c}" data-act="repSet" data-id="${esc(r.id)}" data-v="${v}">${l}</button>`;const o=[];
  if(r.status==='booked')o.push(b('received','Đã nhận máy'));
  if(r.status==='received')o.push(r.kind==='outsource'?b('sent','Gửi đối tác'):b('repairing','Bắt đầu sửa'));
  if(r.status==='repairing'||r.status==='sent')o.push(b('ready','Sửa xong','btn-green'));
  if(r.status==='ready')o.push(b('returned','Trả máy, thu tiền','btn-green'));
  o.push(`<button class="btn sm ghost" data-act="repForm" data-id="${esc(r.id)}">Sửa</button>`);
  return o.join('');
}
function aRep(){
  const f=S.repSt;let list=S.repairs.slice().sort((a,b)=>b.createdAt-a.createdAt);
  if(f==='open')list=list.filter(r=>['booked','received','repairing','sent','ready'].includes(r.status));else if(f!=='all')list=list.filter(r=>r.status===f);
  return hd('Sửa chữa','Thay pin, màn hình tại shop. Lỗi phức tạp: tiếp nhận rồi gửi đối tác, theo dõi chi phí gửi sửa.',W_OK()?`<button class="btn btn-red" data-act="repForm">+ Nhận máy sửa</button>`:'')+
  `<div class="toolbar"><div class="chips">${[['open','Đang mở'],['booked','Đặt lịch online'],['returned','Đã trả'],['all','Tất cả']].map(([k,l])=>`<button class="chip ${f===k?'on':''}" data-act="set" data-k="repSt" data-v="${k}">${l}</button>`).join('')}</div></div>${repTable(list.slice(0,200),false)}
  <div class="hd" style="margin-top:32px"><div><h1 style="font-size:20px">Bảng giá dịch vụ</h1><div class="muted">Hiện trên website, mục Sửa chữa.</div></div>${W_OK()?`<button class="btn" data-act="svcForm">+ Thêm dịch vụ</button>`:''}</div>${svcTable(true)}`;
}

  let h=hd('Ảnh sản phẩm','Tải ảnh chụp thật để hiện trên website thay cho hình minh họa. Ảnh theo màu được ưu tiên, nếu không có sẽ dùng ảnh chung của dòng máy.');

    return `<div class="list-h" style="margin-top:22px"><h3>${esc(mm.model)} <span class="muted" style="font-weight:500;font-size:13px">${mm.cat}</span></h3><div class="acts">${btn(mk,'Ảnh chung mọi màu',mm.model,'')}</div></div>
    <div class="ph-grid">${cols.map(c=>{const key=slug(mm.model+' '+c);const own=m[key];const src=own&&own.img?imgUrl(own.img):(m[mk]&&m[mk].img?imgUrl(m[mk].img):null);
      return `<div class="ph-card"><div class="im">${src?`<img src="${esc(src)}" alt="">`:devSVG(mm.cat,c)}</div><div class="bd"><b style="font-size:14px">${esc(c||'(chưa ghi màu)')}</b><span class="muted" style="font-size:12px">${own?'Có ảnh riêng màu này':m[mk]?'Đang dùng ảnh chung':'Đang dùng hình minh họa'}</span><div class="acts">${btn(key,'Tải ảnh màu này',mm.model,c)}</div></div></div>`}).join('')}</div>`}).join('');

const ST_ROLES=['Bán hàng','Kỹ thuật','Quản lý','Khác'];
function staffStats(name){const mk=mKey(now());const os=S.orders.filter(o=>o.status==='done'&&o.staff===name&&mKey(o.doneAt||o.createdAt)===mk);const rs=S.repairs.filter(r=>r.status==='returned'&&r.staff===name&&mKey(r.returnedAt||r.createdAt)===mk);
  return {orders:os.length,sales:os.reduce((s,o)=>s+(+o.total||0),0),repairs:rs.length,repRev:rs.reduce((s,r)=>s+(+r.quote||0),0)}}
function aStaffProfile(){

  h+=`<div class="banner" style="background:#EEF3F9;color:#244A72"><b>Tài khoản đăng nhập:</b> bấm “+ Thêm nhân viên”, đặt tên đăng nhập và mật khẩu rồi gửi cho nhân viên. Nhân viên vào <b>shopnhatao.com/quan-tri</b> để đăng nhập. Nghỉ việc: chuyển <b>Đã nghỉ</b> là bị khóa và đăng xuất khỏi mọi thiết bị.</div>`;
  const act=list.filter(s=>s.status!=='off');const tot=act.reduce((a,s)=>{const t=staffStats(s.name);a.o+=t.orders;a.s+=t.sales;a.r+=t.repairs;return a},{o:0,s:0,r:0});

    return `<tr><td><b>${esc(s.name)}</b><span class="s">${esc(s.phone||'')}${s.note?' · '+esc(s.note):''}</span></td><td>${esc(s.role||'')}</td><td>${s.username?`<b style="font-family:ui-monospace,monospace;font-size:13px">${esc(s.username)}</b><span class="s">${s.perm==='owner'?'Quyền chủ shop':'Quyền nhân viên'}</span>`:pill('Chưa có tài khoản','gray')}</td><td class="num">${t.orders}</td><td class="num"><b>${money(t.sales)}</b></td><td class="num">${t.repairs}${t.repRev?`<span class="s">${money(t.repRev)}</span>`:''}</td><td>${s.startDate?fmtD(new Date(s.startDate+'T09:00:00').getTime()):''}</td><td>${s.status==='off'?pill('Đã nghỉ','gray'):pill('Đang làm','green')}</td><td>${W_OK()?`<div class="acts"><button class="btn sm" data-act="staffForm" data-id="${esc(s.id)}">Sửa</button><button class="btn sm ghost" data-act="staffDel" data-id="${esc(s.id)}" data-name="${esc(s.name)}">Xóa</button></div>`:''}</td></tr>`}).join('')}</tbody></table></div>
  <p class="muted" style="font-size:13px;margin-top:10px">Doanh số tính theo đơn “Hoàn tất” và phiếu sửa “Đã trả” mà nhân viên đó thao tác trong tháng này.</p>`;
}
/* ---------- chấm công & lương ---------- */
const DEF_RATE=25000;
const toMin=t=>{const m=String(t||'').match(/^(\d{1,2})[:hH.](\d{2})/);return m?(+m[1])*60+(+m[2]):null};
function shiftHours(s){const a=toMin(s.in),b=toMin(s.out);if(a==null||b==null)return null;let d=b-a;if(d<0)d+=1440;d-=(+s.breakMin||0);return Math.max(0,d)/60}
const staffRate=st=>+(st&&st.rate)||DEF_RATE;
const shRate=s=>+s.rate||staffRate(S.staffList.find(x=>x.id===s.staffId));
const shPay=s=>{const hh=shiftHours(s);return hh==null?0:Math.round(hh*shRate(s))};
const hm=hh=>{if(hh==null)return '—';const m=Math.round(hh*60);return Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')};
const curMonth=()=>S.shMonth||isoDay().slice(0,7);
const WD=['CN','T2','T3','T4','T5','T6','T7'];
const dayLbl=d=>{const x=new Date(d+'T12:00:00');return WD[x.getDay()]+' '+String(x.getDate()).padStart(2,'0')+'/'+String(x.getMonth()+1).padStart(2,'0')};
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const activeStaff=()=>S.staffList.filter(s=>s.status!=='off').sort((a,b)=>String(a.name).localeCompare(b.name,'vi'));
const staffOpts=(sel,all)=>(all?'<option value="">Tất cả nhân viên</option>':'')+(all?S.staffList:activeStaff()).map(s=>`<option value="${esc(s.id)}" ${sel===s.id?'selected':''}>${esc(s.name)}${s.status==='off'?' (đã nghỉ)':''}</option>`).join('');
function monthShifts(m,sid){return S.shifts.filter(s=>String(s.date||'').startsWith(m)&&(!sid||s.staffId===sid))}
function clockCard(){const ses=S.auth.uid&&S.staffList.find(x=>x.id===S.auth.uid);if(!ses)return '';
  const today=isoDay();const open=S.shifts.find(s=>s.staffId===ses.id&&!s.out&&s.date>=isoDay(Date.now()-864e5));
  const mine=monthShifts(curMonth(),ses.id);const hrs=mine.reduce((a,s)=>a+(shiftHours(s)||0),0);
  return `<div class="panel" style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap"><div><b>Chấm công · ${esc(ses.name)}</b><div class="muted" style="font-size:13px">${open?`Đang trong ca từ <b>${esc(open.in)}</b> (${dayLbl(open.date)})`:'Chưa vào ca'} · Tháng này: <b>${hm(hrs)}</b></div></div>${W_OK()?(open?`<button class="btn btn-red" data-act="clockOut" data-id="${esc(open.id)}">Kết ca (${nowHM()})</button>`:`<button class="btn btn-green" data-act="clockIn">Vào ca (${nowHM()})</button>`):''}</div>`}
function aStaff(){
  if(!S.shMonth)S.shMonth=isoDay().slice(0,7);
  const tabs=[['profile','Hồ sơ nhân viên'],['shifts','Chấm công'],['pay','Bảng lương']];
  const chips=`<div class="chips" style="margin-bottom:16px">${tabs.map(([k,l])=>`<button class="chip ${S.stTab===k?'on':''}" data-act="set" data-k="stTab" data-v="${k}">${l}</button>`).join('')}</div>`;
  return chips+(S.stTab==='shifts'?aShifts():S.stTab==='pay'?aPayroll():aStaffProfile());
}
function aShifts(){
  const m=curMonth();const list=monthShifts(m,S.shStaff).sort((a,b)=>(b.date+b.in).localeCompare(a.date+a.in));
  const tot=list.reduce((a,s)=>{a.h+=shiftHours(s)||0;a.p+=shPay(s);return a},{h:0,p:0});const open=list.filter(s=>!s.out).length;
  let h=hd('Chấm công','Nhập giờ vào và giờ kết ca theo từng ngày. Lương tính theo số giờ × lương/giờ của từng người (mặc định 25.000đ/giờ).',W_OK()?`<button class="btn btn-red" data-act="shiftForm">+ Thêm ca</button><button class="btn" data-act="weekForm">Nhập cả tuần</button><button class="btn" data-act="shImport">Nhập từ Excel</button>`:'');
  h+=`<div class="toolbar"><input id="sh-month" type="month" data-chg="shMonth" value="${esc(m)}" style="max-width:180px"><select id="sh-staff" data-chg="shStaff" style="max-width:220px">${staffOpts(S.shStaff,true)}</select></div>`;
  h+=`<div class="kpis"><div class="kpi"><small>Số ca</small><b>${list.length}</b>${open?`<span>${open} ca chưa kết thúc</span>`:'<span>&nbsp;</span>'}</div><div class="kpi"><small>Tổng giờ làm</small><b>${hm(tot.h)}</b></div><div class="kpi"><small>Lương tạm tính</small><b>${money(tot.p)}</b></div></div>`;
  if(!S.staffList.length)return h+`<div class="empty">Thêm hồ sơ nhân viên trước ở mục “Hồ sơ nhân viên”.</div>`;
  if(!list.length)return h+`<div class="empty">Chưa có ca làm nào trong tháng ${m.slice(5)}/${m.slice(0,4)}.</div>`;
  return h+`<div class="tbl-wrap"><table><thead><tr><th>Ngày</th><th>Nhân viên</th><th>Giờ vào</th><th>Giờ ra</th><th class="num">Nghỉ</th><th class="num">Số giờ</th><th class="num">Lương/giờ</th><th class="num">Thành tiền</th><th>Ghi chú</th><th></th></tr></thead><tbody>${list.map(s=>`<tr><td><b>${dayLbl(s.date)}</b></td><td>${esc(s.staffName||'')}</td><td>${esc(s.in||'')}</td><td>${s.out?esc(s.out):pill('Đang làm','amber')}${toMin(s.out)!=null&&toMin(s.out)<toMin(s.in)?'<span class="s">qua đêm</span>':''}</td><td class="num">${+s.breakMin?s.breakMin+' ph':''}</td><td class="num"><b>${hm(shiftHours(s))}</b></td><td class="num">${money(shRate(s))}</td><td class="num"><b>${shiftHours(s)==null?'—':money(shPay(s))}</b></td><td>${esc(s.note||'')}</td><td>${W_OK()?`<div class="acts"><button class="btn sm" data-act="shiftForm" data-id="${esc(s.id)}">Sửa</button><button class="btn sm ghost" data-act="del" data-col="shifts" data-id="${esc(s.id)}" data-name="${esc('ca '+dayLbl(s.date)+' của '+(s.staffName||''))}">Xóa</button></div>`:''}</td></tr>`).join('')}</tbody></table></div>`;
}
function payRows(m){const ids=new Set([...activeStaff().filter(s=>s.perm!=='owner').map(s=>s.id),...monthShifts(m).map(s=>s.staffId)]);
  return [...ids].map(id=>{const st=S.staffList.find(x=>x.id===id)||{id,name:(monthShifts(m,id)[0]||{}).staffName||'?'};const sh=monthShifts(m,id);const hrs=sh.reduce((a,s)=>a+(shiftHours(s)||0),0);const base=sh.reduce((a,s)=>a+shPay(s),0);
    const pr=S.payroll.find(p=>p.id===m+'_'+id)||{};const bonus=+pr.bonus||0,deduct=+pr.deduct||0;return {st,sh,hrs,base,bonus,deduct,net:base+bonus-deduct,pr}}).sort((a,b)=>String(a.st.name).localeCompare(b.st.name,'vi'))}
function aPayroll(){
  const m=curMonth();const rows=payRows(m);const tot=rows.reduce((a,r)=>{a.h+=r.hrs;a.n+=r.net;a.p+=r.pr.paid?r.net:0;return a},{h:0,n:0,p:0});
  let h=hd('Bảng lương tháng '+m.slice(5)+'/'+m.slice(0,4),'Lương theo giờ = tổng tiền các ca. Thêm thưởng/phụ cấp hoặc khấu trừ/ứng lương nếu có, rồi đánh dấu đã trả.');
  h+=`<div class="toolbar"><input id="pay-month" type="month" data-chg="shMonth" value="${esc(m)}" style="max-width:180px"></div>`;
  h+=`<div class="kpis"><div class="kpi"><small>Tổng giờ</small><b>${hm(tot.h)}</b></div><div class="kpi"><small>Tổng phải trả</small><b>${money(tot.n)}</b></div><div class="kpi"><small>Đã trả</small><b>${money(tot.p)}</b><span>Còn lại ${money(tot.n-tot.p)}</span></div></div>`;
  if(!rows.length)return h+`<div class="empty">Chưa có nhân viên.</div>`;
  const inp=(r,f)=>`<input id="pa-${f}-${esc(r.st.id)}" data-chg="payAdj" data-sid="${esc(r.st.id)}" data-f="${f}" value="${r[f]||''}" inputmode="numeric" placeholder="0" style="width:110px;text-align:right;padding:6px 8px" ${W_OK()&&!r.pr.paid?'':'disabled'}>`;
  return h+`<div class="tbl-wrap"><table><thead><tr><th>Nhân viên</th><th class="num">Số ca</th><th class="num">Tổng giờ</th><th class="num">Lương/giờ</th><th class="num">Lương theo giờ</th><th class="num">Thưởng / phụ cấp</th><th class="num">Khấu trừ / ứng</th><th class="num">Thực nhận</th><th>Trạng thái</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.st.name)}</b>${r.sh.some(s=>!s.out)?'<span class="s" style="color:var(--amber)">Có ca chưa kết thúc</span>':''}</td><td class="num">${r.sh.length}</td><td class="num">${hm(r.hrs)}</td><td class="num">${money(staffRate(r.st))}</td><td class="num">${money(r.base)}</td><td class="num">${inp(r,'bonus')}</td><td class="num">${inp(r,'deduct')}</td><td class="num"><b>${money(r.net)}</b></td><td>${r.pr.paid?pill('Đã trả '+fmtD(r.pr.paidAt),'green'):pill('Chưa trả','gray')}</td><td><div class="acts"><button class="btn sm" data-act="payslip" data-sid="${esc(r.st.id)}">Phiếu lương</button>${W_OK()?(r.pr.paid?`<button class="btn sm ghost" data-act="payToggle" data-sid="${esc(r.st.id)}" data-v="0">Bỏ đánh dấu</button>`:`<button class="btn sm btn-green" data-act="payToggle" data-sid="${esc(r.st.id)}" data-v="1" ${r.net>0?'':'disabled'}>Đã trả</button>`):''}</div></td></tr>`).join('')}</tbody></table></div>
  <p class="muted" style="font-size:13px;margin-top:10px">Đã đánh dấu “Đã trả” thì số liệu tháng đó được chốt lại (không đổi khi sửa ca sau). Muốn sửa, bấm “Bỏ đánh dấu”.</p>`;
}
function shiftFormHTML(s){s=s||{date:isoDay(),in:'08:30',out:'',breakMin:0,staffId:S.shStaff||''};
  return `<h2>${s.id?'Sửa ca làm':'Thêm ca làm'}</h2><form data-form="shift"><input type="hidden" name="id" value="${esc(s.id||'')}"><div class="fgrid" style="margin-top:12px">
  <div><label>Nhân viên *</label><select name="staffId" required>${s.id&&!activeStaff().some(x=>x.id===s.staffId)?`<option value="${esc(s.staffId)}">${esc(s.staffName||'')}</option>`:''}${staffOpts(s.staffId,false)}</select></div>
  <div><label>Ngày *</label><input name="date" type="date" required value="${esc(s.date)}"></div>
  <div><label>Giờ vào *</label><input name="in" type="time" required value="${esc(s.in||'')}"></div>

const IMP_FIELDS={
  inv:[['cat','Loại sản phẩm (iPhone, iPad…)'],['source','Nguồn nhập'],['origin','Xuất xứ (VN/A, LL/A…)'],['net','Phiên bản (quốc tế / lock…)'],['imei','IMEI / Serial'],['costPrice','Giá nhập'],['price','Giá bán *'],['storage','Dung lượng'],['color','Màu'],['condition','Tình trạng (mới/cũ)'],['battery','Pin %'],['warrantyMonths','Bảo hành (tháng)'],['status','Trạng thái (đã bán…)'],['note','Ghi chú'],['createdAt','Ngày nhập'],['model','Tên máy *']],
  acc:[['costPrice','Giá nhập'],['price','Giá bán *'],['category','Loại'],['qty','Số lượng tồn'],['model','Tên phụ kiện *']]};
const IMP_KW={source:['nguồn nhập','nguon nhap','nguồn','nhà cung cấp','ncc','mua của','supplier'],net:['phiên bản','phien ban','quốc tế','quoc te','lock','bản mạng'],origin:['xuất xứ','xuat xu','mã vùng','ma vung','origin','vùng'],cat:['loại sản phẩm','loại sp','danh mục','nhóm hàng','category'],imei:['imei','serial','số máy'],costPrice:['giá nhập','gia nhap','nhập','vốn','cost'],price:['giá bán','gia ban','bán','giá','price'],storage:['dung lượng','bộ nhớ','gb','rom','dung luong'],color:['màu','mau','color'],condition:['tình trạng','tinh trang','loại máy','mới/cũ','new'],battery:['pin','battery'],warrantyMonths:['bảo hành','bh','warranty'],status:['trạng thái','trang thai','đã bán','status'],note:['ghi chú','ghi chu','note'],createdAt:['ngày nhập','ngay nhap','ngày','date'],model:['tên máy','ten may','model','sản phẩm','tên','máy','dòng'],category:['loại','danh mục','nhóm'],qty:['số lượng','sl','tồn','qty']};
function guessMap(headers,target){const used=new Set(),map={};IMP_FIELDS[target].forEach(([f])=>{const kws=IMP_KW[f]||[];for(const kw of kws){const i=headers.findIndex((h,j)=>!used.has(j)&&String(h).toLowerCase().includes(kw));if(i>=0){map[f]=i;used.add(i);break}}});return map}
function parseMoney(v){if(typeof v==='number')return v>0&&v<1000?Math.round(v*1e6):Math.round(v);const s=String(v||'').toLowerCase().trim();if(!s)return 0;if(/tr|triệu|m\b/.test(s)){const n=parseFloat(s.replace(',','.').replace(/[^\d.]/g,''));return Math.round((n||0)*1e6)}if(/k\b|nghìn|ngàn/.test(s)){const n=parseFloat(s.replace(',','.').replace(/[^\d.]/g,''));return Math.round((n||0)*1e3)}const n=+s.replace(/\D/g,'');return n>0&&n<1000?n*1e6:n}
function parseCond(v){const s=String(v||'').toLowerCase();if(/like|99/.test(s))return 'likenew';if(/mới|moi|new|seal|fullbox/.test(s))return 'new';return 'used'}
function parseStatus(v){const s=String(v||'').toLowerCase();if(/đã bán|da ban|sold|bán rồi|^bán$/.test(s))return 'sold';if(/cọc|coc|giữ|giu/.test(s))return 'reserved';return 'instock'}
function parseStorage(v){let s=String(v||'').toUpperCase().replace(/\s/g,'');if(!s)return '';if(/^\d+$/.test(s))s=+s>=1000||s==='1'?'1TB':s+'GB';if(/^\d+G$/.test(s))s+='B';if(/^1T$/.test(s))s='1TB';return s}
function parseDate(v){if(typeof v==='number'&&v>20000&&v<80000)return Math.round((v-25569)*864e5);const s=String(v||'').trim();const m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]).getTime()}const t=Date.parse(s);return isNaN(t)?now():t}
function mapRow(r,target,map){const g=f=>map[f]!=null?r[map[f]]:'';
  if(target==='inv'){const mdl=String(g('model')).trim();return {cat:CATS.find(c=>String(g('cat')).toLowerCase().includes(c.toLowerCase()))||inferCat(String(g('cat'))+' '+mdl),model:mdl,source:String(g('source')).trim(),origin:String(g('origin')).trim(),net:(()=>{const s=String(g('net')).toLowerCase();if(/lock/.test(s))return 'lock';if(/ngoài mỹ|ngoai my/.test(s))return 'qt';if(/mỹ|my|full|ll\/a/.test(s))return 'qtmy';if(/quốc tế|quoc te|qt/.test(s))return 'qt';if(/vn|chính hãng|chinh hang/.test(s))return 'vn';return guessNet(g('origin'))})(),storage:parseStorage(g('storage')),color:String(g('color')).trim(),condition:parseCond(g('condition')),battery:+String(g('battery')).replace(/[^\d]/g,'')||null,imei:String(g('imei')).replace(/\s/g,''),costPrice:parseMoney(g('costPrice')),price:parseMoney(g('price')),warrantyMonths:+String(g('warrantyMonths')).replace(/[^\d]/g,'')||(parseCond(g('condition'))==='new'?12:6),status:map.status!=null?parseStatus(g('status')):'instock',note:String(g('note')).trim(),createdAt:map.createdAt!=null?parseDate(g('createdAt')):now(),orderCode:''}}
  return {name:String(g('model')).trim(),category:ACC_CATS.find(c=>String(g('category')).toLowerCase().includes(c.toLowerCase()))||'Khác',cost:parseMoney(g('costPrice')),price:parseMoney(g('price')),qty:+String(g('qty')).replace(/[^\d]/g,'')||0}}

function pkgList(){return String(SET().packages||'').split('\n').map(l=>l.split('|').map(s=>s.trim())).filter(a=>a[0]).map(a=>({name:a[0],price:num(a[1]),months:num(a[2])}))}
const vnd=n=>(Math.round(+n||0)).toLocaleString('vi-VN');
function mdLine(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function policyHTML(t){const out=[];let ul=false;String(t||'').split('\n').forEach(l=>{const x=l.trim();if(!x)return;
  if(x.startsWith('+ ')&&ul){out[out.length-1]=out[out.length-1].replace(/<\/li>$/,'<br>– '+mdLine(x.slice(2))+'</li>');return}
  if(x.startsWith('- ')){if(!ul){out.push('<ul>');ul=true}out.push('<li>'+mdLine(x.slice(2))+'</li>');return}
  if(ul){out.push('</ul>');ul=false}
  if(x.startsWith('## '))out.push('<h2>'+mdLine(x.slice(3))+'</h2>');else if(x.startsWith('### '))out.push('<h4>'+mdLine(x.slice(4))+'</h4>');else out.push('<p>'+mdLine(x)+'</p>')});
  if(ul)out.push('</ul>');return out.join('')}
function itemCond(it){if(it.cond)return it.cond;if(it.kind==='phone'){const u=S.inv.find(x=>x.id===it.refId);if(u)return u.condition==='new'?'New Seal':u.condition==='likenew'?'Likenew':'Đã qua sử dụng'}return ''}
function invoiceHTML(o,withPolicy){const st=SET();const items=o.items||[];const rows=items.map((it,i)=>`<tr><td class="c">${i+1}</td><td>${esc(it.name)}${(+it.qty||1)>1?' (x'+(+it.qty)+')':''}</td><td class="c sm">${esc(it.imei||'')}</td><td class="c">${esc(itemCond(it))}</td><td class="c">${it.warrantyMonths?it.warrantyMonths+' tháng':''}</td><td class="r">${vnd(it.price)}</td><td class="r">${vnd((+it.price||0)*(+it.qty||1))}</td></tr>`);
  for(let i=items.length;i<6;i++)rows.push('<tr class="blank"><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>');
  const d=new Date(o.doneAt||o.createdAt||Date.now());
  return `<div class="inv-page"><div class="inv-head"><img src="${LOGO_FULL}" alt=""><div class="inv-shop"><div class="n">${esc(st.name).toUpperCase()}</div><div class="sub">${esc(st.invCompany||'')}</div><div>${esc(st.address)}</div><div>Mobile: ${esc(st.invPhones||st.phone)}</div>${st.invEmail?`<div>Email: ${esc(st.invEmail)}</div>`:''}</div></div>
  <h1>${esc(st.invTitle||'PHIẾU BẢO HÀNH')}</h1><div class="inv-code">Số: ${esc(o.code||'')}</div>
  <div class="inv-cus"><div>Tên khách hàng: ${esc(o.customerName&&o.customerName!=='Khách lẻ'?o.customerName:'')}</div><div>Địa chỉ: ${esc(o.customerAddress||'')}</div><div>Điện thoại: ${esc(o.phone||'')}</div></div>
  <table class="inv-t"><thead><tr><th style="width:6.5%">STT</th><th style="width:28.5%">Sản phẩm</th><th style="width:15%">Serial</th><th style="width:11%">Tình trạng</th><th style="width:10%">Bảo hành</th><th style="width:14%">Đơn giá</th><th style="width:15%">Thành tiền</th></tr></thead><tbody>${rows.join('')}</tbody>
  <tfoot><tr><td colspan="6" class="r b">Tổng cộng:</td><td class="r b">${vnd(o.total)}</td></tr></tfoot></table>
  <div class="inv-sign"><div></div><div><div>Ngày ${d.getDate()} tháng ${d.getMonth()+1} năm ${d.getFullYear()}</div><b>Người bán hàng</b><div class="nm">${esc(String(o.staff||'').toUpperCase())}</div></div></div></div>
  ${withPolicy&&st.invPolicy?`<div class="inv-page inv-policy">${policyHTML(st.invPolicy)}</div>`:''}`}
function printInvoice(o,withPolicy){const a=$('#print-area');a.innerHTML=invoiceHTML(o,withPolicy);const done=()=>{a.innerHTML='';window.removeEventListener('afterprint',done)};window.addEventListener('afterprint',done);
  const imgs=[...a.querySelectorAll('img')];Promise.all(imgs.map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r}))).then(()=>setTimeout(()=>window.print(),50))}
function receiptText(o){const st=SET();const L=[];L.push(st.name.toUpperCase(),st.address,'Hotline: '+st.phone,'----------------------------------','HÓA ĐƠN '+o.code,'Ngày: '+new Date(o.doneAt||o.createdAt).toLocaleString('vi-VN'),'Khách: '+(o.customerName||'Khách lẻ')+(o.phone?' – '+o.phone:''),'----------------------------------');
  (o.items||[]).forEach(i=>{L.push(i.name+(i.qty>1?' x'+i.qty:''));if(i.imei)L.push('  IMEI: '+i.imei);if(i.warrantyMonths)L.push('  Bảo hành: '+i.warrantyMonths+' tháng');L.push('  '+money(i.price*(i.qty||1)))});
  L.push('----------------------------------','TỔNG: '+money(o.total));if(o.deposit)L.push('Đã cọc: '+money(o.deposit),'Còn lại: '+money(o.total-o.deposit));if(o.pay)L.push('Thanh toán: '+o.pay);L.push('Nhân viên: '+(o.staff||''),'','Cảm ơn quý khách! Tra bảo hành online bằng SĐT.');return L.join('\n')}

        let dd=r[cD];if(dd instanceof Date)dd=isoDay(dd.getTime());else if(typeof dd==='number')dd=isoDay(Math.round((dd-25569)*864e5));else{const m=String(dd).match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);dd=m?`${m[3].length===2?'20'+m[3]:m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:''}

        if(!st||!dd||!tin){bad.push(String(r[cN]||'?')+' · '+String(r[cD]||''));return}
        ok.push({staffId:st.id,staffName:st.name,date:dd,in:tin,out:tout,breakMin:cB>=0?num(r[cB]):0,note:cG>=0?String(r[cG]||''):'',rate:staffRate(st),createdAt:now(),by:S.staff,imported:true})});
      S.shPrev={ok,bad};$('#sh-prev').innerHTML=`<div class="box">Đọc được <b>${ok.length}</b> ca hợp lệ${bad.length?`, <b>${bad.length}</b> dòng bị bỏ qua (không khớp tên nhân viên hoặc thiếu ngày/giờ): ${esc(bad.slice(0,5).join('; '))}${bad.length>5?'…':''}`:''}.</div>${ok.length?`<div class="tbl-wrap" style="margin-top:8px"><table><tbody>${ok.slice(0,5).map(x=>`<tr><td>${esc(x.staffName)}</td><td>${dayLbl(x.date)}</td><td>${x.in}–${x.out||'…'}</td><td class="num">${hm(shiftHours(x))}</td></tr>`).join('')}</tbody></table></div><div class="foot"><button class="btn btn-red" data-act="shImportRun">Nhập ${ok.length} ca</button></div>`:''}`}
    catch(e){console.error(e);toast('Không đọc được file')}},
  invCat:el=>{S.invCat=el.value;S.invF={};render()},
  invF:el=>{S.invF={...S.invF,[el.dataset.k]:el.value};render()},

  originNet:el=>{const s=$('#f-net');if(s&&!s.value){const g=guessNet(el.value);if(g)s.value=g}},
  role:el=>{S.preview=el.value;try{sessionStorage.setItem('snt-preview',S.preview)}catch(e){}applyAuth();render()},
  posPay:el=>{S.posCust.pay=el.value},
  cartPrice:el=>{const c=S.cart[+el.dataset.i];if(c){c.price=num(el.value);render()}},
  impTarget:el=>{if(S.imp){S.imp.target=el.value;if(S.imp.headers)S.imp.map=guessMap(S.imp.headers,el.value)}else S.imp={target:el.value};render()},
  impSheet:el=>{loadSheet(el.value);render()},
  impMap:el=>{S.imp.map[el.dataset.f]=el.value===''?undefined:+el.value;render()},
  impFile:async el=>{const f=el.files&&el.files[0];if(!f)return;if(typeof XLSX==='undefined')return toast('Chưa tải được thư viện đọc Excel, thử lại sau');
    try{const buf=await f.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});S.imp={target:(S.imp&&S.imp.target)||'inv',wb,fileName:f.name,sheets:wb.SheetNames};loadSheet(wb.SheetNames[0]);render()}catch(e){console.error(e);toast('Không đọc được file này')}},
};
function loadSheet(name){const I=S.imp;I.sheet=name;const rows=XLSX.utils.sheet_to_json(I.wb.Sheets[name],{header:1,defval:'',raw:true});
  const hi=rows.findIndex(r=>r.filter(c=>String(c).trim()).length>=2);if(hi<0){I.headers=null;return toast('Trang tính trống')}
  I.headers=rows[hi].map(h=>String(h).trim());I.rows=rows.slice(hi+1).filter(r=>r.some(c=>String(c).trim()));I.map=guessMap(I.headers,I.target);I.result='';}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.tagName==='A'&&!b.dataset.act)return;const fn=ACT[b.dataset.act];if(fn){if(b.tagName==='BUTTON'&&b.type!=='submit')e.preventDefault();fn({...b.dataset},b,e)}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('submit',async e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const btn=f.querySelector('button:not([type=button])');if(btn)btn.disabled=true;try{await FORM[f.dataset.form](Object.fromEntries(new FormData(f)),f)}finally{if(btn&&document.contains(btn))btn.disabled=false}});
document.addEventListener('input',e=>{const el=e.target;if(false){const q=el.value;U.search(q).then(hits=>{const box=$('#st-res');if(!box||$('#st-q').value!==q)return;box.innerHTML='';hits.forEach(hh=>{const b=document.createElement('button');b.type='button';b.className='btn sm';b.style.justifyContent='flex-start';b.dataset.act='pickAcc';b.dataset.id=hh.id;b.dataset.name=hh.name;b.textContent=hh.name+(hh.email?' · '+hh.email:'');box.appendChild(b)});if(!hits.length&&q)box.innerHTML='<span class="muted" style="font-size:13px">Không tìm thấy. Nhân viên đã được mời qua Share chưa?</span>'})}else if(el.dataset.live){S[el.dataset.live]=el.value;schedule()}else if(el.dataset.bind){const [a,b]=el.dataset.bind.split('.');S[a][b]=el.value}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.chg&&CHG[el.dataset.chg])CHG[el.dataset.chg](el)});
function renderFormImgs(){const el=$('#f-imgs');if(!el)return;const a=S.formImgs||[];
  el.innerHTML=a.length?`<div class="ph-edit" style="margin-top:0">${a.map((id,i)=>`<div style="${i?'':'outline:2px solid var(--green)'}"><img src="${esc(imgUrl(id))}" alt="" data-act="fimgCover" data-i="${i}" style="cursor:pointer" title="Đặt làm ảnh chính"><div class="acts">${i?`<button type="button" class="btn sm" data-act="fimgCover" data-i="${i}">Làm ảnh chính</button>`:pill('Ảnh chính','green')}<button type="button" class="btn sm ghost" data-act="fimgDel" data-i="${i}">Xóa</button></div></div>`).join('')}</div>`:'<div class="muted" style="font-size:13px">Chưa có ảnh.</div>'}
async function delAsset(id){if(!ASSETS||!id)return;await new Promise(r=>setTimeout(r,500));const used=S.inv.some(u=>unitImgs(u).includes(id))||S.photos.some(p=>p.img===id);if(!used){try{await ASSETS.delete(id)}catch(e){}}}
async function shrink(file){try{const bmp=await createImageBitmap(file);const s=Math.min(1,1200/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/webp',.86));return b&&b.size?b:file}catch(e){return file}}
$('#file-pick').addEventListener('change',async e=>{const files=[...(e.target.files||[])];const f=files[0];const t=S.pick;if(!f||!t)return;if(!ASSETS)return toast('Bạn chưa có quyền tải ảnh');
  if(t.kind==='form'){for(let i=0;i<files.length;i++){toast(`Đang tải ảnh ${i+1}/${files.length}…`);try{const b=await shrink(files[i]);const r=await ASSETS.upload(b,b.type?undefined:{type:'image/jpeg'});(S.formImgs=S.formImgs||[]).push(r.id);renderFormImgs()}catch(err){console.error(err);toast('Không tải được ảnh'+(err&&err.code?' ('+err.code+')':''))}}toast('Đã tải ảnh xong, nhớ bấm Lưu');S.pick=null;return}
  if(t.kind==='unit'){const ids=[];for(let i=0;i<files.length;i++){toast(`Đang tải ảnh ${i+1}/${files.length}…`);try{const b=await shrink(files[i]);const r=await ASSETS.upload(b,b.type?undefined:{type:'image/jpeg'});ids.push(r.id)}catch(err){console.error(err);toast('Không tải được ảnh'+(err&&err.code?' ('+err.code+')':''))}}
    if(ids.length){const u=S.inv.find(x=>x.id===t.id);const ims=[...unitImgs(u),...ids];if(await W(()=>col('inventory').doc(t.id).update({imgs:ims,img:''}),`Đã thêm ${ids.length} ảnh`))setTimeout(()=>ACT.unitPhotos({id:t.id}),250)}
    S.pick=null;return}
  toast('Đang tải ảnh lên…');let up;try{const b=await shrink(f);up=await ASSETS.upload(b,b.type?undefined:{type:'image/jpeg'})}catch(err){console.error(err);return toast(err&&err.code==='too_large'?'Ảnh quá lớn':err&&err.code==='unsupported_type'?'Định dạng ảnh không hỗ trợ (dùng JPG, PNG, WEBP)':'Không tải được ảnh'+(err&&err.code?' ('+err.code+')':''))}
  if(t.kind==='unit'){const u=S.inv.find(x=>x.id===t.id);const old=u&&u.img;if(await W(()=>col('inventory').doc(t.id).update({img:up.id}),'Đã gắn ảnh cho máy')&&old){await delAsset(old)}}
  else{const old=(S.photos.find(x=>x.id===t.key)||{}).img;if(await W(()=>col('photos').doc(t.key).set({model:t.model,color:t.color||'',img:up.id,updatedAt:now()}),'Đã cập nhật ảnh')&&old){await delAsset(old)}}
  S.pick=null});
window.addEventListener('hashchange',()=>{if(/^#may-/.test(location.hash)){const open=$('#modal-body [data-unit-open]');if(!open||open.dataset.unitOpen!==location.hash.slice(5))openFromHash();return}const v=location.hash==='#admin'?'admin':location.hash==='#shop'?'shop':null;if(v&&v!==S.view){S.view=v;render()}});

/* ================= boot (Firebase) ================= */
const FB_OK=typeof firebase!=='undefined'&&window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey;
let fapp=null,fdb=null,fauth=null,fst=null,ffn=null;
if(FB_OK){fapp=firebase.initializeApp(window.FIREBASE_CONFIG);fdb=firebase.firestore();try{fdb.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  fauth=firebase.auth();fst=firebase.storage();ffn=fapp.functions('asia-southeast1');try{fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}}
function wrapRef(r){return {id:r.id,path:r.path,set:(d,o)=>o?r.set(d,o):r.set(d),update:d=>r.update(d),delete:()=>r.delete(),get:()=>r.get(),
  onSnapshot:(n,e)=>r.onSnapshot(s=>n({exists:s.exists,data:()=>s.data()}),e)}}
const FDB={collection:p=>{const c=fdb.collection(p);return {path:p,doc:id=>wrapRef(id?c.doc(id):c.doc())}},doc:p=>wrapRef(fdb.doc(p))};
async function callFn(name,data){const r=await ffn.httpsCallable(name)(data);return r.data}
function fnErr(e){console.warn(e);const m=e&&e.message&&!/internal/i.test(e.message)?e.message:'Chưa gửi được, bạn thử lại hoặc nhắn Zalo cho shop nhé.';toast(m);return null}
const FSAssets={upload:async(blob)=>{const ext=(blob.type||'image/jpeg').split('/')[1].replace('jpeg','jpg');const ref=fst.ref('products/'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)+'.'+ext);
    await ref.put(blob,{contentType:blob.type||'image/jpeg',cacheControl:'public,max-age=31536000'});const url=await ref.getDownloadURL();return {id:url,url}},
  delete:async(id)=>{try{if(/^https?:/.test(id))await fst.refFromURL(id).delete()}catch(e){console.warn(e)}return {deleted:true}}};
function imgUrl(id){return /^(https?:|data:|blob:|\/)/.test(String(id||''))?id:''}

const PUBLIC_COLS=['inventory','accessories','services','photos'];
const STAFF_COLS=['orders','repairs','staff','shifts'];
const OWNER_COLS=['costs','payroll'];
const subs={};
function listen(c,query){if(subs[c])return;const k=KEY[c];
  subs[c]=(query||fdb.collection(c)).onSnapshot(s=>{const arr=s.docs.map(d=>({...d.data(),id:d.id}));
    if(c==='inventory')S.invRaw=arr;else if(c==='accessories')S.accRaw=arr;else S[k]=arr;mergeCosts();
    if(c==='staff')applyAuth();S.loaded[c]=true;if(c==='inventory'&&S.pendingUnit)setTimeout(openFromHash,0);schedule()},
    e=>{console.warn(c,e);S.loaded[c]=true;if(e.code!=='permission-denied')S.err=e.code;schedule()})}
function unlisten(cols){cols.forEach(c=>{if(subs[c]){subs[c]();delete subs[c]}const k=KEY[c];if(c==='inventory')S.invRaw=[];else if(c==='accessories')S.accRaw=[];else if(k)S[k]=[];S.loaded[c]=true});mergeCosts()}
function markLoaded(cols){cols.forEach(c=>{if(!subs[c])S.loaded[c]=true})}

render();
if(/^#may-/.test(location.hash))S.pendingUnit=location.hash.slice(5);
if(!FB_OK){S.noDb=true;S.auth.ready=true;render();toast('Chưa cấu hình Firebase (firebase-config.js)')}
else{
  DB=FDB;
  PUBLIC_COLS.forEach(c=>listen(c));markLoaded([...STAFF_COLS,...OWNER_COLS]);
  fdb.doc('settings/shop').onSnapshot(s=>{S.settings=s.exists?s.data():null;S.mailOk=!!(S.settings&&S.settings.mailReady);schedule()},()=>{});
  const timer=setTimeout(()=>{S.slow=true;schedule()},10000);
  let staffUnsub=null;
  fauth.onAuthStateChanged(async u=>{
    if(staffUnsub){staffUnsub();staffUnsub=null}
    unlisten([...STAFF_COLS,...OWNER_COLS]);ASSETS=null;
    if(!u){S.auth={ready:true,staff:false,owner:false,name:'',uid:null};applyAuth();render();return}
    S.auth={ready:false,staff:false,owner:false,name:'',uid:u.uid};render();
    let me=await fdb.doc('staff/'+u.uid).get().catch(()=>null);
    if((!me||!me.exists)&&u.email&&!u.email.endsWith('@'+STAFF_DOMAIN)){try{await callFn('bootstrapOwner',{});me=await fdb.doc('staff/'+u.uid).get()}catch(e){console.warn('bootstrap',e)}}
    const d=me&&me.exists?me.data():null;
    if(!d||d.status==='off'){S.auth={ready:true,staff:false,owner:false,name:'',uid:u.uid,noAccess:true};applyAuth();render();return}
    S.auth={ready:true,staff:true,owner:d.perm==='owner',name:d.name||u.email,uid:u.uid,roleName:d.role||''};ASSETS=FSAssets;applyAuth();
    // live watch own staff record (khóa ngay khi bị chuyển "Đã nghỉ")
    staffUnsub=fdb.doc('staff/'+u.uid).onSnapshot(s=>{const x=s.data();if(!x||x.status==='off'){fauth.signOut()}},()=>{});
    ['orders','repairs','staff'].forEach(c=>listen(c));
    listen('shifts',S.auth.owner?null:fdb.collection('shifts').where('staffId','==',u.uid));
    if(S.auth.owner)OWNER_COLS.forEach(c=>listen(c));
    clearTimeout(timer);render()});
}
</script>
